<!doctype html>
<html lang="en" data-theme="light" data-text-size="100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Naadi (नाड़ी): Delhi bus journeys timed from real bus GPS." />
    <link rel="icon" href="/favicon.svg" />
    <title>Naadi · Dilli ki naadi, har pal</title>
    <style>
      html,body{margin:0;min-height:100%;font-family:system-ui,sans-serif;background:#f6f7f9;color:#111827}#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:12px;background:#f6f7f9;color:#111827}#splash[hidden]{display:none}#splash svg{width:64px;height:64px;color:#1a3a8f}#splash .wordmark{font-size:24px;font-weight:600}#splash .wordmark span{color:#e8730c}#splash-status{font-size:14px;color:#4b5563}.splash-progress{width:160px;height:3px;background:#e3e5e8;overflow:hidden}.splash-progress i{display:block;width:35%;height:100%;background:#1a3a8f;animation:splash 1.2s infinite}@keyframes splash{to{transform:translateX(470%)}}@media(prefers-reduced-motion:reduce){.splash-progress i{animation:none}}html[data-theme=dark],html[data-theme=dark] body{background:#0b0f17;color:#f3f4f6}html[data-theme=dark] #splash{background:#0b0f17;color:#f3f4f6}
    </style>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <svg viewBox="-50 -50 100 100" aria-hidden="true"><circle cx="0" cy="0" r="44" fill="none" stroke="currentColor" stroke-width="6"/><circle cx="0" cy="0" r="8" fill="#ff9933"/></svg>
      <div class="wordmark">Naadi <span>नाड़ी</span></div>
      <div>Dilli ki naadi, har pal</div><div class="splash-progress"><i></i></div><div id="splash-status">Loading Naadi…</div>
      <div id="splash-error" hidden>Naadi couldn't start. Check your connection and try again.<br><button id="splash-reload" data-testid="splash-reload">Reload</button></div>
    </div>
    <noscript>Naadi needs JavaScript to show the map and plan journeys.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
